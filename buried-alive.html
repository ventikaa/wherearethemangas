<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BURIED ALIVE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #ba-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #080604;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
  }
  #ba-overlay.active { display: flex; }

  #ba-close {
    position: absolute;
    top: 20px; right: 24px;
    background: none;
    border: 1px solid rgba(191,28,18,.4);
    color: #ede4d0;
    font-size: 16px;
    width: 36px; height: 36px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    transition: background .15s;
  }
  #ba-close:hover { background: #bf1c12; border-color: #bf1c12; }

  #ba-intro {
    text-align: center;
    animation: fadeIn .5s ease forwards;
  }
  #ba-intro h1 {
    font-family: 'Courier New', monospace;
    font-size: clamp(28px, 5vw, 60px);
    letter-spacing: .2em;
    color: #ede4d0;
    margin-bottom: 16px;
  }
  #ba-intro h1 span { color: #bf1c12; }
  #ba-intro p {
    font-size: 12px;
    letter-spacing: .4em;
    color: #6a6258;
    text-transform: uppercase;
    margin-bottom: 40px;
    animation: blink 1s step-end infinite;
  }
  #ba-start-btn {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #080604;
    background: #bf1c12;
    border: none;
    padding: 14px 44px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  #ba-start-btn:hover { background: #8c0e08; transform: translateY(-2px); }

  #ba-game { display: none; width: 100%; height: 100vh; position: relative; overflow: hidden; }
  #ba-game.active { display: block; }

  #ba-canvas {
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  #ba-hud {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 28px;
    z-index: 5;
  }
  .ba-hud-item {
    font-size: 10px;
    letter-spacing: .3em;
    color: #6a6258;
    text-transform: uppercase;
  }
  .ba-hud-item span { color: #bf1c12; font-size: 13px; }

  #ba-instructions {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: .3em;
    color: #2a2018;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #ba-egg-popup {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #0e0b08;
    border: 1px solid #bf1c12;
    padding: 28px 40px;
    text-align: center;
    z-index: 20;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    pointer-events: none;
    min-width: 240px;
  }
  #ba-egg-popup.show {
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }
  #ba-egg-img-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
  }
  #ba-egg-img {
    width: 72px; height: 72px;
    object-fit: contain;
    image-rendering: pixelated;
    display: block;
  }
  #ba-egg-name {
    font-size: 16px;
    letter-spacing: .3em;
    color: #ede4d0;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  #ba-egg-text {
    font-size: 9px;
    letter-spacing: .25em;
    color: #6a6258;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  #ba-egg-continue {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #bf1c12;
    background: none;
    border: 1px solid rgba(191,28,18,.4);
    padding: 8px 20px;
    cursor: pointer;
    transition: background .15s;
  }
  #ba-egg-continue:hover { background: #bf1c12; color: #080604; }

  #ba-end {
    display: none;
    position: absolute;
    inset: 0;
    background: #080604;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 30;
  }
  #ba-end.active { display: flex; }
  #ba-end-line1 { font-size: clamp(11px,1.5vw,14px); letter-spacing:.5em; color:#6a6258; text-transform:uppercase; margin-bottom:20px; opacity:0; }
  #ba-end-line2 { font-size: clamp(24px,4vw,48px); letter-spacing:.12em; color:#ede4d0; text-transform:uppercase; margin-bottom:14px; opacity:0; line-height:1.2; }
  #ba-end-line3 { font-size: clamp(10px,1.2vw,13px); letter-spacing:.4em; color:#bf1c12; text-transform:uppercase; opacity:0; }
  #ba-end-close {
    margin-top: 40px;
    font-family: 'Courier New', monospace;
    font-size: 10px; letter-spacing:.3em; text-transform:uppercase;
    color:#3a3028; background:none; border:1px solid #3a3028;
    padding:10px 28px; cursor:pointer; opacity:0;
    transition: color .15s, border-color .15s;
  }
  #ba-end-close:hover { color:#ede4d0; border-color:#ede4d0; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div id="ba-overlay">
  <button id="ba-close">✕</button>

  <div id="ba-intro">
    <h1>SOME<span>THING</span><br>IS BURIED.</h1>
    <p>Dig to find it ▮</p>
    <button id="ba-start-btn">START DIGGING</button>
  </div>

  <div id="ba-game">
    <div id="ba-hud">
      <div class="ba-hud-item">DEPTH <span id="ba-depth">0</span>m</div>
      <div class="ba-hud-item">FOUND <span id="ba-found">0</span>/4</div>
    </div>
    <canvas id="ba-canvas"></canvas>
    <div id="ba-instructions">SPACEBAR OR CLICK TO DIG</div>

    <div id="ba-egg-popup">
      <div id="ba-egg-img-wrap">
        <img id="ba-egg-img" src="" alt=""/>
      </div>
      <div id="ba-egg-name"></div>
      <div id="ba-egg-text"></div>
      <button id="ba-egg-continue">KEEP DIGGING →</button>
    </div>
  </div>

  <div id="ba-end">
    <div id="ba-end-line1">you made it.</div>
    <div id="ba-end-line2">good things come<br>to those who wait.</div>
    <div id="ba-end-line3">BURIED ALIVE &nbsp;·&nbsp; 31.07.25</div>
    <button id="ba-end-close">CLOSE ✕</button>
  </div>
</div>

<script>
(function() {
  const CANVAS_W = Math.min(window.innerWidth, 480);
  const CANVAS_H = window.innerHeight;
  const TOTAL_DEPTH = 800;

  const EGGS = [
    { worldY: 160, img: 'pics/game/mango.png',      name: 'MANGO',          text: 'a familiar fruit.' },
    { worldY: 320, img: 'pics/game/controller.png', name: 'PS5 CONTROLLER', text: 'he plays too much.' },
    { worldY: 480, img: 'pics/game/guitar.png',     name: "ADI'S GUITAR",   text: 'the weapon of choice.' },
    { worldY: 640, img: 'pics/game/skeleton.png',   name: 'SKELETON',       text: 'getting warmer...' },
  ];

  const DIRT_LAYERS = [
    { start: 0,   color: '#3d2b1f' },
    { start: 200, color: '#2e1f14' },
    { start: 400, color: '#1e1208' },
    { start: 600, color: '#100906' },
  ];

  let scrollY = 0;
  let charWorldY = 60;
  let digging = false;
  let digFrame = 0;
  let digTimer = 0;
  let eggsFound = 0;
  let paused = false;
  let gameOver = false;
  let animId;
  const particles = [];

  // Generate rocks
  const rocks = [];
  for (let i = 0; i < 20; i++) {
    rocks.push({
      x: Math.random() * (CANVAS_W - 60) + 10,
      worldY: 80 + Math.random() * (TOTAL_DEPTH - 80),
      w: 12 + Math.random() * 20,
      h: 8 + Math.random() * 12,
    });
  }

  const imgs = {};
  ['idle','raise','swing','hit','mango','controller','guitar','skeleton'].forEach(k => {
    imgs[k] = new Image();
    imgs[k].src = k === 'idle'  ? 'pics/game/digger-idle.png'
                : k === 'raise' ? 'pics/game/digger-raise.png'
                : k === 'swing' ? 'pics/game/digger-swing.png'
                : k === 'hit'   ? 'pics/game/digger-hit.png'
                : `pics/game/${k}.png`;
  });

  const canvas = document.getElementById('ba-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;

  document.getElementById('ba-start-btn').addEventListener('click', startGame);
  document.getElementById('ba-close').addEventListener('click', closeGame);
  document.getElementById('ba-egg-continue').addEventListener('click', resumeGame);
  document.getElementById('ba-end-close').addEventListener('click', closeGame);

  window.openBuriedAlive = function() {
    document.getElementById('ba-overlay').classList.add('active');
  };

  function closeGame() {
    document.getElementById('ba-overlay').classList.remove('active');
    cancelAnimationFrame(animId);
    resetGame();
  }

  function resetGame() {
    scrollY = 0; charWorldY = 60; digging = false;
    digFrame = 0; digTimer = 0; eggsFound = 0;
    paused = false; gameOver = false;
    particles.length = 0;
    EGGS.forEach(e => delete e.found);
    document.getElementById('ba-intro').style.display = '';
    document.getElementById('ba-game').classList.remove('active');
    document.getElementById('ba-end').classList.remove('active');
    document.getElementById('ba-egg-popup').classList.remove('show');
    document.getElementById('ba-depth').textContent = '0';
    document.getElementById('ba-found').textContent = '0';
    window.removeEventListener('keydown', onKey);
    canvas.removeEventListener('click', onDig);
  }

  function startGame() {
    document.getElementById('ba-intro').style.display = 'none';
    document.getElementById('ba-game').classList.add('active');
    window.addEventListener('keydown', onKey);
    canvas.addEventListener('click', onDig);
    loop();
  }

  function onKey(e) { if (e.code === 'Space' && !paused && !gameOver) { e.preventDefault(); triggerDig(); } }
  function onDig()  { if (!paused && !gameOver) triggerDig(); }
  function triggerDig() { if (digging) return; digging = true; digFrame = 0; digTimer = 0; }

  function loop() { update(); draw(); animId = requestAnimationFrame(loop); }

  function update() {
    if (paused || gameOver) return;

    if (digging) {
      digTimer++;
      if (digTimer > 5) {
        digTimer = 0;
        digFrame++;
        if (digFrame >= 4) {
          digFrame = 0;
          digging = false;
          charWorldY += 32;

          // scroll camera when char reaches 60% screen height
          const charScreenY = charWorldY - scrollY;
          if (charScreenY > CANVAS_H * 0.6) {
            scrollY = charWorldY - CANVAS_H * 0.6;
          }

          // dirt particles
          const csx = CANVAS_W/2 - 32;
          const csy = charWorldY - scrollY;
          for (let i = 0; i < 6; i++) {
            particles.push({
              x: csx + 30 + (Math.random()-.5)*30,
              y: csy + 20,
              vx: (Math.random()-.5)*3,
              vy: -1.5 - Math.random()*2,
              life: 25 + Math.random()*15,
              color: getDirtColor(charWorldY),
            });
          }

          document.getElementById('ba-depth').textContent = Math.floor(charWorldY / 8);
          checkEggs();
          if (charWorldY >= TOTAL_DEPTH) triggerEnd();
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function getDirtColor(worldY) {
    let c = DIRT_LAYERS[0].color;
    for (const l of DIRT_LAYERS) { if (worldY >= l.start) c = l.color; }
    return c;
  }

  function checkEggs() {
    for (const egg of EGGS) {
      if (!egg.found && charWorldY >= egg.worldY) {
        egg.found = true;
        eggsFound++;
        document.getElementById('ba-found').textContent = eggsFound;
        showEgg(egg);
        break;
      }
    }
  }

  function showEgg(egg) {
    paused = true;
    document.getElementById('ba-egg-img').src = egg.img;
    document.getElementById('ba-egg-name').textContent = egg.name;
    document.getElementById('ba-egg-text').textContent = egg.text;
    document.getElementById('ba-egg-popup').classList.add('show');
  }

  function resumeGame() {
    document.getElementById('ba-egg-popup').classList.remove('show');
    paused = false;
  }

  function triggerEnd() {
    gameOver = true;
    cancelAnimationFrame(animId);
    const end = document.getElementById('ba-end');
    end.classList.add('active');
    ['#ba-end-line1','#ba-end-line2','#ba-end-line3','#ba-end-close'].forEach((sel, i) => {
      setTimeout(() => {
        const el = document.querySelector(sel);
        el.style.animation = 'slideUp .6s ease forwards';
        el.style.opacity = 1;
      }, 300 + i * 600);
    });
  }

  function draw() {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    // Background
    ctx.fillStyle = '#080604';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Dirt layers
    for (let i = 0; i < DIRT_LAYERS.length; i++) {
      const l = DIRT_LAYERS[i];
      const next = DIRT_LAYERS[i+1];
      const top = l.start - scrollY;
      const bot = next ? next.start - scrollY : CANVAS_H + 100;
      if (bot < 0 || top > CANVAS_H) continue;
      ctx.fillStyle = l.color;
      ctx.fillRect(0, Math.max(0,top), CANVAS_W, Math.min(CANVAS_H,bot) - Math.max(0,top));
    }

    // Noise
    ctx.globalAlpha = 0.03;
    for (let y = 0; y < CANVAS_H; y += 4) {
      for (let x = 0; x < CANVAS_W; x += 4) {
        if (Math.random() > 0.65) { ctx.fillStyle='#fff'; ctx.fillRect(x,y,2,2); }
      }
    }
    ctx.globalAlpha = 1;

    // Rocks
    const holeLeft  = CANVAS_W/2 - 36;
    const holeRight = CANVAS_W/2 + 36;
    for (const rock of rocks) {
      const sy = rock.worldY - scrollY;
      if (sy < -20 || sy > CANVAS_H + 20) continue;
      if (rock.x > holeLeft - 10 && rock.x < holeRight + 10) continue;
      if (rock.worldY > charWorldY) {
        ctx.fillStyle = '#1a1410';
        ctx.beginPath();
        ctx.ellipse(rock.x, sy, rock.w/2, rock.h/2, 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#2a2018';
        ctx.beginPath();
        ctx.ellipse(rock.x-2, sy-2, rock.w/4, rock.h/4, 0.3, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Tunnel
    const grad = ctx.createLinearGradient(holeLeft, 0, holeRight, 0);
    grad.addColorStop(0,   'rgba(4,3,2,.92)');
    grad.addColorStop(.15, 'rgba(4,3,2,.98)');
    grad.addColorStop(.85, 'rgba(4,3,2,.98)');
    grad.addColorStop(1,   'rgba(4,3,2,.92)');
    ctx.fillStyle = grad;
    const tunEnd = (charWorldY + 60) - scrollY;
    ctx.fillRect(holeLeft, 0, holeRight - holeLeft, Math.min(tunEnd, CANVAS_H));

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = p.life / 40;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    }
    ctx.globalAlpha = 1;

    // Character
    const charScreenX = CANVAS_W/2 - 36;
    const charScreenY = charWorldY - scrollY;
    const sprite = digging
      ? ([imgs.idle, imgs.raise, imgs.swing, imgs.hit][digFrame] || imgs.idle)
      : imgs.idle;

    if (sprite && sprite.complete && sprite.naturalWidth > 0) {
      ctx.drawImage(sprite, charScreenX, charScreenY - 70, 72, 90);
    } else {
      ctx.fillStyle = '#bf1c12';
      ctx.fillRect(charScreenX + 16, charScreenY - 60, 20, 28);
      ctx.fillRect(charScreenX + 20, charScreenY - 32, 10, 22);
    }

    // Vignette
    const vig = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_H*.25, CANVAS_W/2, CANVAS_H/2, CANVAS_H*.75);
    vig.addColorStop(0, 'transparent');
    vig.addColorStop(1, 'rgba(8,6,4,.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  }
})();
</script>
</body>
</html>
