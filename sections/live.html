<section id="live">
  <div class="live-inner">
    <div class="section-label reveal">On Stage</div>
    <h2 class="about-heading reveal" style="margin-bottom:48px">LIVE SHOWS</h2>

    <div class="live-carousel-wrap">
      <div class="live-track">

        <div class="live-card" data-show="summer-bang">
          <div class="live-img-wrap">
            <img src="pics/shows/summer-bang-cover.jpg" alt="Summer Bang House Party"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
            <div class="live-img-fallback">SUMMER BANG<br>HOUSE PARTY</div>
          </div>
          <div class="live-body">
            <div class="live-outlet">House Party</div>
            <div class="live-title">Summer Bang House Party</div>
            <div class="live-meta">Chennai</div>
            <span class="live-arrow">→</span>
          </div>
        </div>

        <div class="live-card" data-show="turn-up-devoid">
          <div class="live-img-wrap">
            <img src="pics/shows/turn-up-devoid-cover.jpg" alt="Turn Up for Devoid"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
            <div class="live-img-fallback">TURN UP<br>FOR DEVOID</div>
          </div>
          <div class="live-body">
            <div class="live-outlet">Show</div>
            <div class="live-title">Turn Up for Devoid</div>
            <div class="live-meta">Chennai</div>
            <span class="live-arrow">→</span>
          </div>
        </div>

        <div class="live-card" data-show="running-in-circles">
          <div class="live-img-wrap">
            <img src="pics/shows/running-in-circles-cover.jpg" alt="Running in Circles Tour"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
            <div class="live-img-fallback">RUNNING IN<br>CIRCLES TOUR</div>
          </div>
          <div class="live-body">
            <div class="live-outlet">Tour</div>
            <div class="live-title">Running in Circles Tour</div>
            <div class="live-meta">2025</div>
            <span class="live-arrow">→</span>
          </div>
        </div>

      </div>

      <!-- dots -->
      <div class="live-dots">
        <button class="live-dot active"></button>
      </div>
    </div>
  </div>
</section>

<!-- gallery modal -->
<div class="show-modal" id="showModal">
  <div class="show-modal-inner">
    <button class="show-modal-close">✕</button>
    <div class="show-modal-title"></div>
    <div class="show-modal-grid"></div>
  </div>
</div>

<!-- fullscreen lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close">✕</button>
  <button class="lightbox-prev">&#8592;</button>
  <button class="lightbox-next">&#8594;</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" src="" alt=""/>
  </div>
</div>

<div class="divider"></div>
